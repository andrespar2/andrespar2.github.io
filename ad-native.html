<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0c">
  <title>Publicidad · ParFlix</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #0b0b0c;
      color: #f5f5f7;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    #container-0b49e206ab92aabeebe7d6c0c2ac4ebd {
      width: 100%;
      margin: 0 auto;
    }
    iframe, img {
      max-width: 100%;
      border: 0;
    }

    /* Variante compacta para la app: una sola tarjeta nativa, sin el feed
       completo de varias tarjetas. El sitio web conserva el formato completo. */
    .app #container-0b49e206ab92aabeebe7d6c0c2ac4ebd
      .container-0b49e206ab92aabeebe7d6c0c2ac4ebd__bn-container {
      display: none !important;
    }

    .app #container-0b49e206ab92aabeebe7d6c0c2ac4ebd
      .container-0b49e206ab92aabeebe7d6c0c2ac4ebd__bn-container:first-of-type {
      display: block !important;
    }
  </style>
</head>
<body>
  <script>
    if (window.location.search.indexOf("app=1") !== -1) {
      document.documentElement.classList.add("app");

      // La app muestra una sola tarjeta nativa. Se retiran las tarjetas
      // adicionales del feed para no cargar creatividades que el usuario no ve
      // y para reducir el consumo de memoria en WebView antiguas.
      window.addEventListener("DOMContentLoaded", function () {
        var container = document.getElementById("container-0b49e206ab92aabeebe7d6c0c2ac4ebd");
        if (!container) return;

        var prune = function () {
          var cards = container.querySelectorAll(
            ".container-0b49e206ab92aabeebe7d6c0c2ac4ebd__bn-container"
          );
          for (var i = 1; i < cards.length; i++) {
            cards[i].remove();
          }
        };

        var observer = new MutationObserver(prune);
        observer.observe(container, { childList: true, subtree: true });
        window.setTimeout(function () {
          prune();
          observer.disconnect();
        }, 10000);
      });
    }
  </script>
  <script async data-cfasync="false" src="https://bancadeltempoidea.org/21/0b49e206ab92aabeebe7d6c0c2ac4ebd"></script>
  <div id="container-0b49e206ab92aabeebe7d6c0c2ac4ebd"></div>
</body>
</html>
